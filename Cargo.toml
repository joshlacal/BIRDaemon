[package]
name = "bird-daemon"
version = "0.1.0"
edition = "2021"
description = "BIRD - Bluesky DM chatbot daemon using MLS encryption"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# MLS protocol (from catbird-mls)
catbird_mls = { path = "../catbird-mls", features = ["legacy-orchestrator"] }

# AT Protocol authentication and generated Catbird chat types
petrel = { path = "../Petrel/rust/petrel" }
petrel-core = { path = "../Petrel/rust/petrel-core" }
petrel-catbird = { path = "../PetrelCatbird/rust/petrel-catbird" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (for LLM + MLS XRPC calls)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Storage
rusqlite = { version = "=0.37.0", features = ["bundled-sqlcipher"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async traits
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# WebSocket (for MLS event subscription)
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }

# DAG-CBOR (for WebSocket frame parsing)
ciborium = "0.2"

# Crypto / encoding
base64 = "0.22"
ed25519-dalek = "2.2"
openmls_basic_credential = { version = "=0.6.0-rc.3", git = "https://github.com/joshlacal/openmls", rev = "679bdc31ef44dc919f28aee9ce442ec8eb0682c0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "=0.6.0-rc.3", git = "https://github.com/joshlacal/openmls", rev = "679bdc31ef44dc919f28aee9ce442ec8eb0682c0", features = ["extensions-draft", "draft-ietf-mls-pq-ciphersuites"] }
sha2 = "0.10"
hex = "0.4"

# Utilities
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
futures-util = "0.3"
dotenvy = "0.15"
url = "2.5"
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
bytes = "1"
http = "1"
