[package]
name = "bird-daemon"
version = "0.1.0"
edition = "2021"
description = "BIRD - Bluesky DM chatbot daemon using MLS encryption"

[dependencies]
# Unified clean-slate MLS + Labyrinth SDK (`G2`, `G3`, `I15`, `I16`)
catbird_mls = { path = "../catbird-mls" }
catbird-atproto = { path = "../catbird-atproto" }

# Async runtime & HTTP client (LLM + direct federated mls-ds / PDS XRPC calls; zero Nest per G3)
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

# Serialization & async traits
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto, encoding & utilities
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
futures-util = "0.3"
dotenvy = "0.15"
url = "2"
dirs = "7"

[dev-dependencies]
tempfile = "3"
p256 = { version = "0.13", features = ["ecdsa"] }
labyrinth-protocol = { path = "../labyrinth/labyrinth-protocol" }
